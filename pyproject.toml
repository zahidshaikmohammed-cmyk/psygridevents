[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psygridevents"
version = "0.1.0"
description = "Precision-first event and news intelligence engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
feed = [
    "feedparser>=6.0,<7",
    "httpx>=0.27,<1",
]
test = [
    "pytest>=8,<9",
]

[project.scripts]
psygridevents = "psygridevents.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
