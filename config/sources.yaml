    off_hours_poll_seconds: 3600
    params: {timespan: 60min, maxrecords: 75}
    queries:
      - "sourcecountry:IN sourcelang:english (stock OR shares OR NSE OR Sensex)"
      - "sourcecountry:IN sourcelang:english (order OR contract OR acquisition) crore"
