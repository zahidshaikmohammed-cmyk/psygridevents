version: "2.0.0"

# PSYGRIDEVENTS production source matrix (free / public sources only).
#
# Rules (enforced by code, see providers/registry.py):
#  * No URL here is trusted blindly. Every `auto` source is PROBED on the
#    production host at start-up and again before every session; it is polled
#    only if the probe returns the documented structure (a parseable feed with
#    items, a CSV with the documented columns, ...). A wrong or retired URL
#    therefore fails closed as DISCONNECTED -- it can never produce data.
#  * robots.txt is honoured for every host. No cookies, logins, CAPTCHAs or
#    anti-bot challenges are ever attempted. A 401/403/429 is a failure.
#  * `verification` records WHY the URL is here:
#      documented_indexed  -- the exact URL is published by / indexed from the
#                             publisher (search-engine indexed feed title or the
#                             publisher's own documentation).
#      official_catalogue  -- resolved at probe time from the publisher's own
#                             RSS catalogue page (catalogue_url + catalogue_match).
#      curated_directory   -- listed in an independent curated feed directory;
#                             probe-validated before use.
#      none                -- no documented machine-readable endpoint exists;
#                             listed as kind=unavailable so the matrix is honest.
#  * quality is the evidence class: PRIMARY / OFFICIAL / REPUTABLE_SECONDARY /
#    DISCOVERY_ONLY. DISCOVERY_ONLY items can never become a confirmed trading
#    event on their own.
#  * poll_seconds applies during PRE_MARKET/MARKET; off_hours_poll_seconds otherwise.

defaults:
  activation: auto
  poll_seconds: 90
  off_hours_poll_seconds: 900
  max_items: 200

sources:
  # ------------------------------------------------------------------ NSE (PRIMARY)
