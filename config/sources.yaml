  # ------------------------------------------------------------------ Discovery only
  - id: google_news_india_markets
    name: Google News (India markets discovery)
    kind: google_news
    quality: DISCOVERY_ONLY
    category: discovery
    url: https://news.google.com/rss/search
    verification: documented_indexed
    evidence: "Public Google News RSS search endpoint (no official API docs; personal-use RSS). Headlines/links only."
    poll_seconds: 300
    off_hours_poll_seconds: 1800
    max_items: 60
    params: {when: 1d, edition: {hl: en-IN, gl: IN, ceid: "IN:en"}}
    queries:
      - "NSE stock order win crore"
      - "shares surge OR plunge NSE"
      - "SEBI order company"
      - "RBI policy repo rate"
      - "anti-dumping duty India"
      - "export ban India commodity"
      - "GST Council decision"
      - "USFDA warning letter OR import alert Indian pharma"
      - "block deal stake sale NSE"
      - "CCI approves acquisition"
