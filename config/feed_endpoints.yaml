version: "1.1.0"

# Only endpoints verified from the publisher's own public documentation are
# placed here. Catalogue-only providers are resolved at runtime from the
# official publisher catalogue and fail closed if discovery/validation fails.
feeds:
  - provider_id: sebi_rss
    publisher: SEBI
    tier: 0
    category: regulatory
    url: https://www.sebi.gov.in/sebirss.xml
    enabled: true

  - provider_id: pib_rss
    publisher: Press Information Bureau
    tier: 0
    category: government_policy
    url: https://pib.gov.in/RssMain.aspx?ModId=6&Lang=1&Regid=1
    enabled: true

  - provider_id: rbi_press_releases_rss
    publisher: Reserve Bank of India
    tier: 0
    category: central_bank_press_releases
    url: https://rbi.org.in/pressreleases_rss.xml
    enabled: true

  - provider_id: rbi_notifications_rss
    publisher: Reserve Bank of India
    tier: 0
    category: central_bank_notifications
    url: https://rbi.org.in/notifications_rss.xml
    enabled: true

  - provider_id: rbi_speeches_rss
    publisher: Reserve Bank of India
    tier: 0
    category: central_bank_speeches
    url: https://rbi.org.in/speeches_rss.xml
    enabled: true

  - provider_id: rbi_publications_rss
    publisher: Reserve Bank of India
    tier: 0
    category: central_bank_publications
    url: https://rbi.org.in/Publication_rss.xml
    enabled: true

  - provider_id: nse_catalogue
    publisher: NSE India
    tier: 0
    category: corporate_disclosure
    url: https://www.nseindia.com/static/rss-feed
    enabled: true
    mode: catalogue
