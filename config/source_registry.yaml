version: "2.0.0"

# Evidence tiers are reliability/authority classes, not truth guarantees.
# Detailed provider definitions live in config/providers.json.
# No undocumented endpoint is guessed or activated.

source_policy:
  tier_0: first_party_truth
  tier_1: premium_financial_wire
  tier_2: event_news_analytics
  tier_3: broad_discovery_context
  tier_4: open_web_social_discovery

sources:
  exchange_first_party:
    enabled: true
    tier: 0
    providers: [nse_rss, bse_corporate_data]
  regulator_first_party:
    enabled: true
    tier: 0
    providers: [sebi_rss]
  central_bank_first_party:
    enabled: true
    tier: 0
    providers: [rbi_rss]
  government_first_party:
    enabled: true
    tier: 0
    providers: [pib_rss]
  premium_financial_wire:
    enabled: false
    tier: 1
    providers: [lseg_reuters, bloomberg_event_feeds, factset_news]
  event_news_analytics:
    enabled: false
    tier: 2
    providers: [ravenpack, benzinga, perigon, newscatcher]
  broad_discovery_context:
    enabled: false
    tier: 3
    providers: [gdelt, polygon_news, marketaux, newsapi]
  open_web_social_discovery:
    enabled: false
    tier: 4
    providers: []

activation_rules:
  - "Only use concrete feed URLs that have been verified from the provider's official documentation/catalogue."
  - "Never infer or reverse-engineer a production endpoint from an undocumented website request."
  - "Keep provider provenance on every observation."
  - "Treat secondary discovery as evidence requiring corroboration when materiality is high."
  - "Do not redistribute premium provider content outside the applicable license."
