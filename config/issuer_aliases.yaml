version: "2.0.0"

# Entity-resolution reference data used by entity_resolution.EntityResolver.
#
# Precedence at runtime (highest first):
#   1. NSE filing-link symbol (".../corporate/<SYMBOL>_<timestamp>_...pdf")  -- first party
#   2. Official issuer names fetched from NSE (EQUITY_L.csv, NIFTY index lists)
#      into the `issuers` table by the pre-market issuer-master refresh
#   3. The curated names/aliases below (bootstrap until 2 is available)
#   4. Unambiguous uppercase NSE symbol tokens ("TCS", "RELIANCE")
#
# Every symbol below is validated against config/instruments.json at load;
# an entry for a symbol outside the universe is dropped (logged), never used.
# Names are matched as proper nouns: every word of the matched span must be
# capitalised in the source text, so "crude oil India imports" never matches
# "Oil India".

# Phrases that contain an issuer name but refer to something else. A match
# lying inside one of these phrases is discarded.
blocked_phrases:
  - "Reserve Bank of India"
  - "Securities and Exchange Board of India"
  - "Insurance Regulatory and Development Authority of India"
  - "Competition Commission of India"
  - "Bombay Stock Exchange"
  - "BSE Sensex"
  - "National Stock Exchange"
  - "NSE Nifty"
  - "Government of India"
  - "Union Bank of India"
  - "Life Insurance Corporation Act"

# Symbols that are ordinary words, exchange names or <=3-letter acronyms.
# A bare token never resolves to these; they need an exchange qualifier
# ("NSE: OIL", "NSE:IDEA") or a company-name/alias match.
ambiguous_symbols: [OIL, STAR, RAIN, ACE, BETA, APEX, FACT, IDEA, TI, NH, LT, BSE, MCX, INA, TAC, YOGI, CERA,
  SIKA, ATUL, SULA, JASH, RUPA, GAJA, NAVA, ARIS, TEGA, SHK, BEL, HAL, ITI, IOB, IRB, PTC, PPL, EPL, TIL, WEL,
  CCL, CUB, SIS, BLS, BBL, SBC, KCP, NFL, CAMS, DOMS, ERIS, BASF, ABB, SAIL, DLF, GAIL, IEX, IGL, MGL, ITC, IOC,
  PNB, TCS, CDSL, SRF, UPL, VBL, AWL, FDC, KEC, KEI, MRF, NCC, BCG, FSL, HGS, ICIL, ACC, BDL, KSB, HMT, MMTC,
  LMW, NRL, AMAL, EPIGRAL, ANUP, BBTC, PCBL, TNPL, IFCI, IDBI, RBA, HCC, HCG, KIMS, OAL, BEPL, SEIL, SPAL, TARC,
  LTF, LTM, LTTS, PFC, IRFC, NHPC, CESC, GNFC, GSFC, GPPL, CGCL, GAEL, DYCL, KICL, PCCL, VHL, ACGL, RIIL, JARO,
  AFSL, SEPC, RSWM, SVLL, LGHL, SGIL, RNFI, KECL, MEIL, TREL, BLAL, ABDL, AIIL, GHCL, GPIL, HSCL, IMFA, HEXT,
  IKS, IGIL, PGEL, PGIL, PGHL, JWL, JLHL, SBFC, E2E, MSPL, NIBE, VOGL, DCAL, BEML, GRSE, KRBL, MOIL, BBL, JSL,
  CCL, ZEEL, SJVN, NAVA, NBCC, ITI, ATGL, KPIL, MFSL, VEDL, NMDC, NTPC, ONGC, BPCL, BHEL, SBIN, INFY, LICI]

issuers:
  RELIANCE: {names: ["Reliance Industries"], aliases: [{alias: "RIL", kind: abbreviation, confidence: 0.85}, {alias: "Jio Platforms", kind: subsidiary, confidence: 0.75}, {alias: "Reliance Retail", kind: subsidiary, confidence: 0.75}, {alias: "Mukesh Ambani", kind: promoter, confidence: 0.6}]}
