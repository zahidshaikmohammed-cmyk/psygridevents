version: "1.1.0"

event_rules:
  earnings:
    base_confidence: 0.86
    triggers: [results, earnings, revenue, profit, ebitda, eps, guidance, outlook]
  order:
    base_confidence: 0.84
    triggers: ["order win", "wins order", "order book", contract, "purchase order", awarded, award]
  capital_action:
    base_confidence: 0.90
    triggers: [buyback, dividend, "bonus issue", "stock split", "rights issue", "preferential issue", "fund raise"]
  merger_acquisition:
    base_confidence: 0.90
    triggers: [acquire, acquisition, merger, demerger, "stake purchase", divestment]
  regulation:
    base_confidence: 0.88
    triggers: [sebi, regulator, "regulatory action", penalty, "compliance order", "show cause notice"]
  government_policy:
    base_confidence: 0.84
    triggers: [tariff, subsidy, incentive, tax, duty, "government policy", budget]
  macro:
    base_confidence: 0.82
    triggers: [inflation, cpi, wpi, gdp, pmi, unemployment, "industrial production"]
  central_bank:
    base_confidence: 0.90
    triggers: ["repo rate", "policy rate", "rate cut", "rate hike", liquidity, rbi]
  commodity:
    base_confidence: 0.80
    triggers: ["crude oil", "natural gas", coal, copper, aluminium, "steel prices", commodity]
  geopolitical:
    base_confidence: 0.80
    triggers: [sanctions, "trade restriction", "export ban", war, conflict, "shipping disruption"]
  legal:
    base_confidence: 0.86
    triggers: [lawsuit, litigation, "court order", settlement, investigation, injunction]
  rating:
    base_confidence: 0.90
    triggers: ["credit rating", "rating upgrade", "rating downgrade", "rating outlook"]
  management:
    base_confidence: 0.82
    triggers: [appointed, resigned, ceo, cfo, "managing director", "management change"]
  operational:
    base_confidence: 0.84
    triggers: ["plant shutdown", "plant outage", "production cut", "capacity expansion", fire, "cyber attack", "production disruption"]
  corporate:
    base_confidence: 0.62
    triggers: ["board meeting", "corporate announcement", "material disclosure"]

# Negation is evaluated contextually in code. "no" is retained as a signal,
# but legal/regulatory identifier forms such as "Certificate No. 5742" are
# explicitly excluded so identifiers cannot become semantic negation.
negation_patterns:
  - '\bno\b'
  - '\bnot\b'
  - '\bdenied\b'
  - '\bdenies\b'
  - '\bdenied that\b'
  - '\bno plans to\b'
  - '\bhas not\b'
negation_exclusions:
  - '\b(?:order|certificate|case|appeal)\s+no\.?\b'

modality_patterns:
  hypothetical:
    - '\bmay\b'
    - '\bmight\b'
    - '\bcould\b'
    - '\bpotentially\b'
  planned:
    - '\bplans to\b'
    - '\bwill\b'
    - '\bexpected to\b'
    - '\bset to\b'
  reported:
    - '\breportedly\b'
    - '\bsources said\b'
    - '\baccording to sources\b'

horizon_patterns:
  immediate:
    - '\btoday\b'
    - '\bimmediately\b'
    - '\bwith immediate effect\b'
  near_term:
    - '\bthis quarter\b'
    - '\bnext quarter\b'
    - '\bcoming months\b'
    - '\bnext few months\b'
  medium_term:
    - '\bnext year\b'
    - '\bby 20\d{2}\b'
    - '\bmedium term\b'
  long_term:
    - '\blong term\b'
    - '\bover the next \d+ years\b'

effect_patterns:
  direct:
    - '(?:revenue|profit|ebitda|margin|capacity|production|sales)\s+(?:rose|fell|increased|decreased|declined|grew|expanded|contracted)[^.]*'
    - '(?:costs?|expenses?)\s+(?:rose|fell|increased|decreased|declined|grew)[^.]*'
  indirect:
    - '(?:could|may|is expected to)\s+(?:affect|impact|benefit|hurt)[^.]*'
  competitor:
    - '(?:competitors?|rivals?)\s+(?:could|may|are expected to)[^.]*'
  supply_chain:
    - '(?:supplier|suppliers|customer|customers|supply chain|input costs?)\s+[^.]*'

magnitude_regex: '(?:₹|INR|Rs\.?|USD|US\$|\$|EUR|€|AED)\s?[0-9][0-9,]*(?:\.[0-9]+)?\s?(?:crore|lakh|million|billion|trillion|mn|bn|tn)?|[0-9][0-9,]*(?:\.[0-9]+)?\s?(?:%|percent|bps|basis points|MW|GW|tonnes|tons|barrels|million|billion|crore|lakh)'
